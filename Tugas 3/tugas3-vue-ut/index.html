<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA - Tugas 3 Vue.js</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app" class="page-shell">
    <section class="hero hero-large">
      <div class="hero-copy">
        <p class="eyebrow">STSI4209 Pemrograman Berbasis Web</p>
        <h1>Sistem Pemesanan Bahan Ajar SITTA</h1>
        <p class="hero-text">
          Aplikasi Vue.js berbasis komponen untuk mengelola stok dan tracking DO bahan ajar UT.
        </p>
      </div>
      <div class="hero-panel">
        <div class="hero-panel-head">Aplikasi Tugas Praktik 3</div>
        <div class="panel-meta">
          <button class="button button-secondary" :class="{ active: activeTab === 'stok' }" type="button" @click="setTab('stok')">Stok</button>
          <button class="button button-secondary" :class="{ active: activeTab === 'tracking' }" type="button" @click="setTab('tracking')">Tracking DO</button>
        </div>
      </div>
    </section>

    <section v-if="appMessage" class="panel">
      <p class="error-text" v-text="appMessage"></p>
    </section>

    <section v-if="loading" class="panel">
      <p>Memuat data, harap tunggu...</p>
    </section>

    <ba-stock-table v-show="activeTab === 'stok'" :stock-items="stockItems" :upbjj-list="upbjjList" :kategori-list="kategoriList"></ba-stock-table>
    <ba-do-tracking v-show="activeTab === 'tracking'" :pengiriman-list="pengirimanList" :paket-list="paketList" :tracking-records="trackingRecords"></ba-do-tracking>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/components/status-badge.js"></script>
  <script src="js/components/app-modal.js"></script>
  <script src="js/components/stock-table.js"></script>
  <script src="js/components/do-tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
